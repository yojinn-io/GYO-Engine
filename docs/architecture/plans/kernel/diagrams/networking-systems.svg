<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 940" role="img"><title>網路作為機制上的 System：Match 與 Client 兩個 Runtime</title><desc>上半是 Match Runtime，下半是 Client Runtime，中間是 wire。網路不在 Kernel 裡，全部是帶契約的 System 與 resource；傳輸在 Runtime 邊界外。每個方塊標出它持有的狀態與權威。</desc>
<style>
  svg { font-family: -apple-system, "Segoe UI", "Noto Sans CJK TC", "PingFang TC", sans-serif; }
  .c-coral  { fill: #fbe9e4; stroke: #c4654a; }
  .c-teal   { fill: #e3f3ef; stroke: #2f8f7a; }
  .c-purple { fill: #ece7f6; stroke: #6b4fb3; }
  .c-gray   { fill: #f1f1f1; stroke: #8a8a8a; }
  .th { fill: #222; stroke: none; font-size: 12px; font-weight: 600; }
  .ts { fill: #333; stroke: none; font-size: 10.5px; }
  .arr { stroke: #666; fill: none; stroke-width: 1.2; }
  rect[fill="none"] { fill: none; }
</style>
<rect width="680" height="940" fill="#ffffff"/>
<defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="24" text-anchor="middle">Match Runtime（World M，固定 tick）</text>
<g class="c-gray"><rect x="40" y="40" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="135" y="56" text-anchor="middle" dominant-baseline="central">Ingress System（PreTick）</text>
<text class="ts" x="135" y="74" text-anchor="middle" dominant-baseline="central">消費收件 Resource → 寫 role=Input 暫存</text>
<text class="ts" x="135" y="92" text-anchor="middle" dominant-baseline="central">late／stale 計數；N7 外推</text></g>
<g class="c-gray"><rect x="245" y="40" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">ClockReply System（PreTick）</text>
<text class="ts" x="340" y="74" text-anchor="middle" dominant-baseline="central">讀 Time(tick)、寫 Link 送佇列</text>
<text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">權威：Match tick（N1）</text></g>
<g class="c-gray"><rect x="450" y="40" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="545" y="56" text-anchor="middle" dominant-baseline="central">Admit System（PreTick）</text>
<text class="ts" x="545" y="74" text-anchor="middle" dominant-baseline="central">讀 Link 連線事件 → 生成 Peer 實體</text>
<text class="ts" x="545" y="92" text-anchor="middle" dominant-baseline="central">pv 握手；延後佇列生成（N2）</text></g>
<line x1="340" y1="110" x2="340" y2="134" class="arr" marker-end="url(#a6)"/>
<g class="c-purple"><rect x="40" y="136" width="600" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">FixedUpdate：模擬核心，(c) 區，序列化</text>
<text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">讀 InputRing[tick]、寫 Position／Velocity／Health…；只讀 Time(tick)，不碰 Link</text>
<text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">PoseHistory System：每 tick 存姿態與 AABB（35 tick），給命中回溯讀（N9）；ApplyDeferred；digest</text></g>
<line x1="340" y1="212" x2="340" y2="236" class="arr" marker-end="url(#a6)"/>
<text class="ts" x="352" y="228" text-anchor="start">欄的 change tick（Kernel 第 7 條）</text>
<g class="c-teal"><rect x="40" y="238" width="290" height="124" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="256" text-anchor="middle" dominant-baseline="central">Replication System（PostTick）</text>
<text class="ts" x="185" y="278" text-anchor="middle" dominant-baseline="central">讀：被標記複製的欄 ＋ change tick</text>
<text class="ts" x="185" y="296" text-anchor="middle" dominant-baseline="central">寫：Peer 上的 Ledger 元件（自己的狀態）</text>
<text class="ts" x="185" y="314" text-anchor="middle" dominant-baseline="central">Ledger＝每收件者：確認 tick、遮罩、未確認</text>
<text class="ts" x="185" y="332" text-anchor="middle" dominant-baseline="central">只決定重送與去重，不是判定狀態的副本（N4）</text>
<text class="ts" x="185" y="350" text-anchor="middle" dominant-baseline="central">變更比 Ledger 確認 tick 新的才送</text></g>
<g class="c-teal"><rect x="350" y="238" width="290" height="124" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="256" text-anchor="middle" dominant-baseline="central">Interest System（PostTick，在 Replication 前）</text>
<text class="ts" x="495" y="278" text-anchor="middle" dominant-baseline="central">讀：Position、產品給的規則 resource</text>
<text class="ts" x="495" y="296" text-anchor="middle" dominant-baseline="central">寫：Peer 上的 Visibility 遮罩</text>
<text class="ts" x="495" y="314" text-anchor="middle" dominant-baseline="central">失去可見→despawn；重現→整個送（N5）</text>
<text class="ts" x="495" y="332" text-anchor="middle" dominant-baseline="central">規則是資料（100 m／30 m），System 只執行</text>
<text class="ts" x="495" y="350" text-anchor="middle" dominant-baseline="central">私人資料：遮罩上只對本人開（pv10）</text></g>
<line x1="340" y1="362" x2="340" y2="386" class="arr" marker-end="url(#a6)"/>
<g class="c-gray"><rect x="40" y="388" width="600" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">Egress System（Send）：寫 Link 送佇列，每收件者一份 ≤1200 B</text>
<text class="ts" x="340" y="428" text-anchor="middle" dominant-baseline="central">Updates：結構變更與事件，可靠有序，每 tick 一則，原子套用；事件帶依賴 tick（N3、N11）</text>
<text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">Mutations：值變動，不可靠，帶「至少先套用到哪個 Updates」；今天 GYO 只有這一半</text></g>
<rect x="40" y="480" width="600" height="86" rx="10" class="c-coral" fill-opacity="0.35" stroke-dasharray="6 4" stroke-width="1"/>
<text class="th" x="340" y="500" text-anchor="middle">Runtime 邊界外：Link ＋ Transport ＋ Gateway（N10）</text>
<text class="ts" x="340" y="522" text-anchor="middle">Link：收／送兩條 byte 佇列 ＋ 連線狀態，是 resource 不是 System；Transport：通道、可靠性、分片、ack、頻寬</text>
<text class="ts" x="340" y="542" text-anchor="middle">Gateway（Go）：連線身分與路由，無狀態；可靠通道的帳本在 Match 的 Ledger，不在 Gateway</text>
<text class="ts" x="340" y="560" text-anchor="middle">pv 契約在 .proto 欄位號，不是登錄順序；握手比版本（N2，GYO 的做法保留）</text>
<text class="th" x="340" y="594" text-anchor="middle">Client Runtime（World C，幀 ＋ 固定步重入）</text>
<g class="c-gray"><rect x="40" y="610" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="135" y="626" text-anchor="middle" dominant-baseline="central">Receive System（PreUpdate）</text>
<text class="ts" x="135" y="644" text-anchor="middle" dominant-baseline="central">讀 Link → 寫 Confirmed 欄</text>
<text class="ts" x="135" y="662" text-anchor="middle" dominant-baseline="central">Updates 先於 Mutations 套用</text></g>
<g class="c-gray"><rect x="245" y="610" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="626" text-anchor="middle" dominant-baseline="central">Timeline System（PreUpdate）</text>
<text class="ts" x="340" y="644" text-anchor="middle" dominant-baseline="central">寫 Time 速度 ±10%，步長不動</text>
<text class="ts" x="340" y="662" text-anchor="middle" dominant-baseline="central">誤差 &gt;10 tick → snap ＋ TickShift 事件（N6）</text></g>
<g class="c-gray"><rect x="450" y="610" width="190" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="545" y="626" text-anchor="middle" dominant-baseline="central">Input System（FixedPreUpdate）</text>
<text class="ts" x="545" y="644" text-anchor="middle" dominant-baseline="central">寫 InputRing[tick]；冗餘送出</text>
<text class="ts" x="545" y="662" text-anchor="middle" dominant-baseline="central">聽 TickShift 平移 ring（N6、N7）</text></g>
<line x1="340" y1="680" x2="340" y2="704" class="arr" marker-end="url(#a6)"/>
<g class="c-teal"><rect x="40" y="706" width="600" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="724" text-anchor="middle" dominant-baseline="central">Rollback System（PreUpdate，在 Receive 後）</text>
<text class="ts" x="340" y="746" text-anchor="middle" dominant-baseline="central">讀 Confirmed 與 PredictionHistory[tick]；不同 → 把 Predicted 欄重設為 Confirmed，同步重跑 FixedUpdate N 次</text>
<text class="ts" x="340" y="766" text-anchor="middle" dominant-baseline="central">重跑時手動推進 Time(tick)；副作用 System 用 is_in_rollback 條件跳過；需要 Kernel 第 8 條：固定步可重入（N8）</text></g>
<line x1="340" y1="782" x2="340" y2="806" class="arr" marker-end="url(#a6)"/>
<g class="c-purple"><rect x="40" y="808" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="826" text-anchor="middle" dominant-baseline="central">FixedUpdate：和 Match 同一份 System，(c) 區</text>
<text class="ts" x="340" y="848" text-anchor="middle" dominant-baseline="central">只對 Predicted 實體跑；PredictionHistory System 每 tick 存一份；Interpolate（(b) 區）給非預測實體平滑</text></g>
<text class="ts" x="340" y="892" text-anchor="middle">紫＝(c) 區，兩端相同程式；青＝網路層自己的權威狀態（Ledger、遮罩、歷史）；灰＝只持可重建的佇列與估計</text>
<text class="ts" x="340" y="912" text-anchor="middle">網路 System 之間只經 resource 與事件通話；Kernel 一行不含網路；缺 Rollback 的 Match 只是階段空，不是分支</text>
<text class="ts" x="340" y="930" text-anchor="middle">決定性不在複製層的範圍（N12）：複製層只保證最終一致，位元一致由 (c) 區與 determinism.md 的邊界守</text>
</svg>
