<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 900" role="img"><title>一個 Runtime 的機制：控制面、資料面、Executor 與邊界</title><desc>左上控制面：Registry 收 System 描述，分析衝突與依賴，依策略產出執行計畫。右上資料面：World 以 id 存欄、resource、change tick、延後佇列與事件。中間 Executor 依計畫在三種執行環境跑 System。下方是 Runtime 的邊界：葉子模組在 System 內被呼叫，外部服務經訊息邊界，Adapter 只在邊緣。</desc>
<style>
  svg { font-family: -apple-system, "Segoe UI", "Noto Sans CJK TC", "PingFang TC", sans-serif; }
  .c-coral  { fill: #fbe9e4; stroke: #c4654a; }
  .c-teal   { fill: #e3f3ef; stroke: #2f8f7a; }
  .c-purple { fill: #ece7f6; stroke: #6b4fb3; }
  .c-gray   { fill: #f1f1f1; stroke: #8a8a8a; }
  .th { fill: #222; stroke: none; font-size: 12px; font-weight: 600; }
  .ts { fill: #333; stroke: none; font-size: 10.5px; }
  .arr { stroke: #666; fill: none; stroke-width: 1.2; }
  rect[fill="none"] { fill: none; }
</style>
<rect width="680" height="900" fill="#ffffff"/>
<defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="26" text-anchor="middle">一個 Runtime（Client、Match、Editor 各一個，結構相同、內容不同）</text>
<g class="c-coral"><rect x="40" y="44" width="600" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">System ＝ 函式 ＋ 描述（描述從參數型別推出，不手寫第二份）</text>
<text class="ts" x="340" y="84" text-anchor="middle" dominant-baseline="central">資料存取 R/W ｜ 執行：schedule、條件、決定性區 ｜ 顯式依賴 before/after ｜ 執行環境約束 ｜ 外部副作用</text>
<text class="ts" x="340" y="100" text-anchor="middle" dominant-baseline="central">函式體裡才有 Movement、Render、Replication；描述裡只有 id 與標記</text></g>
<line x1="200" y1="112" x2="200" y2="138" class="arr" marker-end="url(#a5)"/>
<text class="ts" x="212" y="130" text-anchor="start">只送描述</text>
<line x1="480" y1="112" x2="480" y2="138" class="arr" marker-end="url(#a5)"/>
<text class="ts" x="468" y="130" text-anchor="end">登記型別換 id</text>
<g class="c-purple"><rect x="40" y="140" width="300" height="300" rx="10" stroke-width="0.5"/>
<text class="th" x="190" y="160" text-anchor="middle" dominant-baseline="central">控制面（不打開函式體）</text>
<rect x="56" y="178" width="268" height="44" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="190" y="192" text-anchor="middle" dominant-baseline="central">Registry：有哪些 System、各宣告什麼</text>
<text class="ts" x="190" y="210" text-anchor="middle" dominant-baseline="central">凍結後不可再登記</text>
<rect x="56" y="230" width="268" height="60" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="190" y="244" text-anchor="middle" dominant-baseline="central">分析：同 id 且一方 Write ＝ 衝突邊</text>
<text class="ts" x="190" y="262" text-anchor="middle" dominant-baseline="central">顯式依賴 ＝ 順序邊；有衝突無順序 ＝ 歧義</text>
<text class="ts" x="190" y="280" text-anchor="middle" dominant-baseline="central">處置見 control-plane-revised.svg（修正後）</text>
<rect x="56" y="298" width="268" height="60" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="190" y="312" text-anchor="middle" dominant-baseline="central">策略：(c) 區序列化、歧義＝錯誤</text>
<text class="ts" x="190" y="330" text-anchor="middle" dominant-baseline="central">(b) 區無衝突可並行、平手依登記順序</text>
<text class="ts" x="190" y="348" text-anchor="middle" dominant-baseline="central">執行環境約束決定落在哪條執行緒</text>
<rect x="56" y="366" width="268" height="60" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="190" y="380" text-anchor="middle" dominant-baseline="central">執行計畫：每個 schedule 一張</text>
<text class="ts" x="190" y="398" text-anchor="middle" dominant-baseline="central">FixedUpdate、FrameUpdate、Extract…</text>
<text class="ts" x="190" y="416" text-anchor="middle" dominant-baseline="central">建一次，之後只跑；條件在跑時求值</text></g>
<g class="c-teal"><rect x="360" y="140" width="280" height="300" rx="10" stroke-width="0.5"/>
<text class="th" x="500" y="160" text-anchor="middle" dominant-baseline="central">資料面：World（不懂業務語義，懂儲存與生命週期契約）</text>
<rect x="376" y="178" width="248" height="44" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="500" y="192" text-anchor="middle" dominant-baseline="central">Entity：index ＋ generation</text>
<text class="ts" x="500" y="210" text-anchor="middle" dominant-baseline="central">配發與回收序列化，順序可重現</text>
<rect x="376" y="230" width="248" height="60" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="500" y="244" text-anchor="middle" dominant-baseline="central">欄：ComponentId → (size, align,</text>
<text class="ts" x="500" y="262" text-anchor="middle" dominant-baseline="central">move, destroy, bytes)，每格 change tick</text>
<text class="ts" x="500" y="280" text-anchor="middle" dominant-baseline="central">Resource：ResourceId → 單一值</text>
<rect x="376" y="298" width="248" height="60" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="500" y="312" text-anchor="middle" dominant-baseline="central">延後佇列：生成、刪除、加欄、移欄</text>
<text class="ts" x="500" y="330" text-anchor="middle" dominant-baseline="central">只在同步點套用，依佇列順序</text>
<text class="ts" x="500" y="348" text-anchor="middle" dominant-baseline="central">hook OnAdd／OnRemove 同步觸發</text>
<rect x="376" y="366" width="248" height="60" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="500" y="380" text-anchor="middle" dominant-baseline="central">事件：寫入者之後本 tick 可讀，保留到下 tick 末</text>
<text class="ts" x="500" y="398" text-anchor="middle" dominant-baseline="central">Time：resource，可替換</text>
<text class="ts" x="500" y="416" text-anchor="middle" dominant-baseline="central">debug：存取時核對宣告，未宣告即斷言</text></g>
<line x1="190" y1="440" x2="190" y2="470" class="arr" marker-end="url(#a5)"/>
<text class="ts" x="202" y="462" text-anchor="start">計畫</text>
<line x1="500" y1="440" x2="500" y2="470" class="arr" marker-end="url(#a5)" marker-start="url(#a5)"/>
<text class="ts" x="512" y="462" text-anchor="start">受限句柄：只給宣告過的 id</text>
<g class="c-gray"><rect x="40" y="472" width="600" height="110" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="492" text-anchor="middle" dominant-baseline="central">Executor：把計畫跑出來，只會呼叫函式指標、交句柄、記 change tick</text>
<rect x="56" y="510" width="180" height="56" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="146" y="528" text-anchor="middle" dominant-baseline="central">主／平台執行緒</text>
<text class="ts" x="146" y="548" text-anchor="middle" dominant-baseline="central">視窗事件、GPU 提交</text>
<rect x="250" y="510" width="180" height="56" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="340" y="528" text-anchor="middle" dominant-baseline="central">Worker pool</text>
<text class="ts" x="340" y="548" text-anchor="middle" dominant-baseline="central">(b) 區無衝突的批</text>
<rect x="444" y="510" width="180" height="56" rx="6" fill="none" stroke-width="0.5"/>
<text class="ts" x="534" y="528" text-anchor="middle" dominant-baseline="central">專用執行緒</text>
<text class="ts" x="534" y="548" text-anchor="middle" dominant-baseline="central">IO、音訊混音</text></g>
<line x1="340" y1="582" x2="340" y2="612" class="arr" marker-end="url(#a5)"/>
<text class="ts" x="352" y="604" text-anchor="start">在 System 函式體裡呼叫</text>
<g class="c-teal"><rect x="40" y="614" width="600" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="632" text-anchor="middle" dominant-baseline="central">葉子模組：純函式，吃資料吐資料，不知道自己在誰的 System 裡</text>
<text class="ts" x="340" y="654" text-anchor="middle" dominant-baseline="central">Math、Base::Result、Collision 的格子查詢、VoxelMesh 的解析與展開、Asset 解析、動畫取樣</text>
<text class="ts" x="340" y="672" text-anchor="middle" dominant-baseline="central">沒有生命週期、沒有更新迴圈、沒有全域狀態；這是「留」的條件</text></g>
<line x1="40" y1="708" x2="640" y2="708" class="arr" stroke-dasharray="6 4"/>
<text class="th" x="340" y="728" text-anchor="middle">Runtime 邊界：外部系統不持有、不修改 World，經受控的訊息與 Adapter 交換資料</text>
<g class="c-gray"><rect x="40" y="744" width="180" height="64" rx="8" stroke-width="0.5"/>
<text class="ts" x="130" y="762" text-anchor="middle" dominant-baseline="central">Gateway（Go）</text>
<text class="ts" x="130" y="780" text-anchor="middle" dominant-baseline="central">訊息佇列進出</text>
<text class="ts" x="130" y="796" text-anchor="middle" dominant-baseline="central">自己的所有權與失敗模式</text></g>
<g class="c-gray"><rect x="250" y="744" width="180" height="64" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="762" text-anchor="middle" dominant-baseline="central">OS、SDL、檔案、socket</text>
<text class="ts" x="340" y="780" text-anchor="middle" dominant-baseline="central">Adapter：API 適配與格式轉換</text>
<text class="ts" x="340" y="796" text-anchor="middle" dominant-baseline="central">不再做調度與生命週期</text></g>
<g class="c-gray"><rect x="460" y="744" width="180" height="64" rx="8" stroke-width="0.5"/>
<text class="ts" x="550" y="762" text-anchor="middle" dominant-baseline="central">gyo.* 資料契約</text>
<text class="ts" x="550" y="780" text-anchor="middle" dominant-baseline="central">工具、腳本、手寫 → 檔案</text>
<text class="ts" x="550" y="796" text-anchor="middle" dominant-baseline="central">由 Asset System 在邊界讀入</text></g>
<text class="ts" x="340" y="846" text-anchor="middle">被取代的：Host 裡手寫的順序、各模組自己的 update 與生命週期、EntityStore 容器、Adapter 裡的協調邏輯</text>
<text class="ts" x="340" y="866" text-anchor="middle">變成機制的規則：獨占寫入、tick 內不改欄、Engine 中立、決定性按區；啟動時檢查，不靠文件</text>
<text class="ts" x="340" y="886" text-anchor="middle">Host 剩下的事：建 World、選 schedule、列 System、接外部服務、跑迴圈；多時鐘、啟停、IO 同步點仍是 Host 的</text>
</svg>
