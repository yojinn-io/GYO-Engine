name: Cross-platform CI
run-name: ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gyo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quick acceptance
    uses: ./.github/workflows/build-and-validate.yml
    with:
      source_commit: ${{ github.sha }}
      profile: quick
