name: Prepare Release
run-name: Prepare Release / ${{ inputs.train }} / ${{ inputs.version }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      train:
        description: Release train, tools or an enabled game id from engine/config/projects.csv
        required: true
        type: string
      version:
        description: Train version; tools use vYYYY.M.N (v2026.10.1), games use SemVer (v5.0.0, v5.1.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Mark the draft as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# The same train version must retain its source commit and complete one draft
# upload at a time. Ordinary branch CI cannot cancel a release preparation.
concurrency:
  group: gyo-prepare-release-${{ inputs.train }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate train, version and capture source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      train: ${{ steps.source.outputs.train }}
      product: ${{ steps.source.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the requested train, version and fixed source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python build/ci/common/release_pipeline.py prepare \
            --event-path "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" \
            --commit "$SOURCE_COMMIT" --ref "$SOURCE_REF" --output "$GITHUB_OUTPUT"
      - name: Record the release candidate
        env:
          RELEASE_TRAIN: ${{ steps.source.outputs.train }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          printf '## Release candidate\n\n- Train: `%s`\n- Tag: `%s`\n- Source: `%s`\n- Commit: `%s`\n\nThe toolchain baseline and every package of this train must pass before a tag or draft is created.\n' \
            "$RELEASE_TRAIN" "$RELEASE_TAG" "$SOURCE_REF" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  # The toolchain rows always run as the engine baseline; a game train adds
  # only its own rows, so another game's failure cannot block this train.
  build:
    name: Full release acceptance
    needs: prepare
    uses: ./.github/workflows/build-and-validate.yml
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}
      profile: release
      product: ${{ needs.prepare.outputs.product }}

  draft:
    name: Prepare verified draft and downloads
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gyo-release-upload-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      # Only this train's product: its packages, then its service record and archives.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gyo-package-${{ needs.prepare.outputs.product }}-*
          path: release-packages
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gyo-service-${{ needs.prepare.outputs.product }}
          path: release-services
          merge-multiple: true
      - name: Verify packages, create the tag and prepare the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TRAIN: ${{ needs.prepare.outputs.train }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          python build/ci/common/release_pipeline.py draft --train "$RELEASE_TRAIN" \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --prerelease "$RELEASE_PRERELEASE" \
            --package-directory release-packages --service-directory release-services --output "$GITHUB_OUTPUT"
      - name: Show the draft for manual publication
        env:
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.draft.outputs.commit }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
        run: |
          printf '## Draft ready for review\n\n[Open draft %s](%s)\n\n- Commit: `%s`\n- Every archive of this train and its SHA-256 file is verified.\n- Review the notes and downloads, then click **Publish release** in GitHub.\n- Publishing does not rebuild the packages.\n' \
            "$RELEASE_TAG" "$RELEASE_URL" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
