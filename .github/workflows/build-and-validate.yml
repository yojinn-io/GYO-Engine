name: Build and validate

on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact source commit captured by the caller
        required: true
        type: string
      profile:
        description: quick or release acceptance
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate source and CI helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.registry.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify the immutable commit and acceptance profile
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ACCEPTANCE_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo '::error::The checkout must match the full source commit SHA.'
            exit 1
          fi
          case "$ACCEPTANCE_PROFILE" in
            quick|release) ;;
            *) echo '::error::Unknown acceptance profile.'; exit 1 ;;
          esac
      - name: Export the authoritative project selection
        id: registry
        run: python build/ci/common/app_registry.py --output "$GITHUB_OUTPUT"
      - name: Test package, draft preparation and smoke failure policies
        run: python -m unittest discover -s tests/common/ci -v

  native:
    name: ${{ matrix.product }} / ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One toolchain product per release platform always exists, including an entirely empty app registry.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      PRESET: ${{ matrix.preset }}
      # Host tools are keyed by the runner, not the target: rows that share a
      # host (macOS arm64 and its x86_64 cross build) share one shader tool.
      GYO_HOST_TOOLS: build/target/_build/host-tools-${{ matrix.host }}
      GYO_CPU_EXECUTION: ${{ matrix.cpu_execution }}
      GYO_PRODUCT: ${{ matrix.product }}
      GYO_SELECTED_TOOLS: ${{ join(matrix.tools, ';') }}
      # VsDevCmd owns Platform (= x64); Windows env names are case-insensitive.
      GYO_PACKAGE_PLATFORM: ${{ matrix.platform }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ACCEPTANCE_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          lfs: true

      - name: Provision the pinned toolchain and compiler cache
        id: setup
        uses: ./.github/actions/native-setup
        with:
          platform: ${{ matrix.platform }}
          toolchain: ${{ matrix.toolchain }}
          preset: ${{ matrix.preset }}
          host: ${{ matrix.host }}
          cpu-execution: ${{ matrix.cpu_execution }}

      - name: Configure the selected product and engine verification
        id: configure
        run: |
          $apps = if ($env:GYO_PRODUCT -eq 'toolchain') { '' } else { $env:GYO_PRODUCT }
          cmake --preset $env:PRESET "-DGYO_SHADER_HOST_BUILD_DIR=$($env:GITHUB_WORKSPACE.Replace('\', '/'))/$env:GYO_HOST_TOOLS" "-DGYO_APPS=$apps" "-DGYO_TOOLS=$env:GYO_SELECTED_TOOLS" -DBUILD_TESTING=ON -DGYO_ENABLE_PACKAGING=ON 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Get-Content "build/target/_build/$env:PRESET/gyo-build.json" -Raw | ConvertFrom-Json
          "GYO_BUILD_CONFIG=$($build.configuration)" >> $env:GITHUB_ENV
          "has_shader_tools=$($build.shader_host_tools.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "has_shader_bundles=$($build.shader_bundles.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify required offline Metal compilation
        if: runner.os == 'macOS' && steps.configure.outputs.has_shader_bundles == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun -sdk macosx metal -v
          printf '#include <metal_stdlib>\nusing namespace metal;\nkernel void probe() {}\n' > "$RUNNER_TEMP/gyo-metal-probe.metal"
          xcrun -sdk macosx metal -c "$RUNNER_TEMP/gyo-metal-probe.metal" -o "$RUNNER_TEMP/gyo-metal-probe.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/gyo-metal-probe.air" -o "$RUNNER_TEMP/gyo-metal-probe.metallib"

      # The restored host-tools CMakeCache records the sccache launcher, so the
      # key family is tied to it and only jobs using native-setup restore it.
      - name: Cache pinned native shader tools
        if: steps.configure.outputs.has_shader_tools == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GYO_HOST_TOOLS }}
          key: shader-tools-v3-sccache-${{ matrix.host }}-${{ matrix.toolchain }}-${{ steps.setup.outputs.compiler }}-${{ hashFiles('engine/render/shaders/pipeline/**', 'build/cmake/GyoShaders.cmake', 'engine/base/include/engine/base/Sha256.hpp', 'engine/base/src/Sha256.cpp') }}

      - name: Build the selected graph and its tests
        id: build
        run: |
          cmake --build --preset $env:PRESET 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CPU, headless and shader tests
        id: tests
        if: inputs.profile == 'release' || matrix.kind == 'toolchain'
        run: |
          ctest --preset $env:PRESET --output-junit "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/logs/tests.xml" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run host shader reflection and rejection tests
        id: shaders
        if: always() && inputs.profile == 'release' && steps.build.outcome == 'success' && steps.configure.outputs.has_shader_tools == 'true'
        run: |
          ctest --test-dir "$env:GYO_HOST_TOOLS" -C Release -L shader --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/logs/shader-tests.xml" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/shader-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The core preset leaves MSVC on /Zi, whose shared per-target PDB is unsafe
      # behind sccache; embedded (/Z7) debug info is MSVC-only and ignored elsewhere.
      # The core preset targets its host, so a cross-built row would only repeat
      # its host row's core baseline; the row's own tests cover its target.
      - name: Build and test core with optional modules disabled
        id: core
        if: always() && matrix.kind == 'toolchain' && matrix.host == matrix.platform && steps.setup.outcome == 'success'
        run: |
          cmake --preset core -B "build/target/_build/$env:PRESET-core" '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=$<$<CONFIG:Debug,RelWithDebInfo>:Embedded>' -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/core-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/target/_build/$env:PRESET-core" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/core-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "build/target/_build/$env:PRESET-core" --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/logs/core-tests.xml" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/core-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify independent copied game fixtures
        id: app_copy
        if: runner.os == 'Windows' && matrix.kind == 'toolchain' && inputs.profile == 'release'
        timeout-minutes: 60
        run: |
          python tests/common/ci/app_copy_integration.py --repository "$env:GITHUB_WORKSPACE" --workdir "build/target/_build/$env:PRESET-app-copy" --reuse-cache "build/target/_build/$env:PRESET/CMakeCache.txt" --parallel $env:CMAKE_BUILD_PARALLEL_LEVEL --logs "build/target/_build/$env:PRESET/logs/app-copy" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/app-copy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble the selected product package
        id: package
        run: |
          cmake --install "build/target/_build/$env:PRESET" --component $env:GYO_PRODUCT --prefix "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/stage" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/acceptance/common/run_package_checks.py --inspect --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --platform $env:GYO_PACKAGE_PLATFORM --revision $env:SOURCE_COMMIT --profile $env:ACCEPTANCE_PROFILE --logs "build/target/_build/$env:PRESET/logs" >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installed native dependencies
        id: package_validation
        run: |
          python build/acceptance/common/validate_package.py --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --logs "build/target/_build/$env:PRESET/logs" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/package-linkage-check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run installed product acceptance
        id: smoke
        timeout-minutes: 20
        run: |
          python build/acceptance/common/run_package_checks.py --context "build/target/_build/$env:PRESET/packages/$env:GYO_PRODUCT/$env:GYO_BUILD_CONFIG/acceptance-context.json" --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --platform $env:GYO_PACKAGE_PLATFORM --revision $env:SOURCE_COMMIT --profile $env:ACCEPTANCE_PROFILE --logs "build/target/_build/$env:PRESET/logs" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/installed-checks.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run common engine and declared product Linux GPU checks
        id: gpu_smoke
        timeout-minutes: 20
        if: runner.os == 'Linux' && (matrix.kind == 'toolchain' || steps.package.outputs.has_gpu == 'true')
        shell: bash
        env:
          HAS_PRODUCT_GPU: ${{ steps.package.outputs.has_gpu }}
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          SDL_LOGGING: '*=info'
        run: |
          set -euo pipefail
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print)
          if [ "${#icds[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Mesa Lavapipe ICD, found ${#icds[@]}"
            exit 1
          fi
          export VK_DRIVER_FILES="${icds[0]}"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gyo-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1920x1080x24' vulkaninfo --summary > "build/target/_build/$PRESET/logs/vulkan-info.log" 2>&1
          if [ "$GYO_PRODUCT" = toolchain ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' ctest \
              --test-dir "build/target/_build/$PRESET" -L gpu -R '^render\.' \
              --no-tests=error --output-on-failure \
              --output-junit "$GITHUB_WORKSPACE/build/target/_build/$PRESET/logs/common-gpu-tests.xml" \
              2>&1 | tee "build/target/_build/$PRESET/logs/common-gpu-tests.log"
          fi
          if [ "$HAS_PRODUCT_GPU" = true ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' python build/acceptance/common/run_package_checks.py \
              --gpu --driver vulkan --context "build/target/_build/$PRESET/packages/$GYO_PRODUCT/$GYO_BUILD_CONFIG/acceptance-context.json" --stage "build/target/_build/$PRESET/stage" --product "$GYO_PRODUCT" \
              --platform "$GYO_PACKAGE_PLATFORM" --revision "$SOURCE_COMMIT" --profile "$ACCEPTANCE_PROFILE" \
              --logs "build/target/_build/$PRESET/logs" 2>&1 | tee "build/target/_build/$PRESET/logs/installed-gpu-checks.log"
          fi

      - name: Archive the verified product package
        id: archive
        run: |
          python build/ci/common/archive_package.py --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --output "build/target/_build/$env:PRESET/gyo-$env:GYO_PRODUCT-$env:GYO_PACKAGE_PLATFORM.tar.gz" --revision $env:SOURCE_COMMIT --platform $env:GYO_PACKAGE_PLATFORM --cpu-execution $env:GYO_CPU_EXECUTION --smoke-report "build/target/_build/$env:PRESET/logs/acceptance.json" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/archive.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload this product and platform package
        if: success() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gyo-package-${{ matrix.product }}-${{ matrix.platform }}
          overwrite: true
          path: |
            build/target/_build/${{ matrix.preset }}/gyo-${{ matrix.product }}-${{ matrix.platform }}.tar.gz
            build/target/_build/${{ matrix.preset }}/gyo-${{ matrix.product }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Go work follows the native package, so a Go failure never skips product
      # acceptance. The toolchain row verifies the engine-layer modules; a
      # product row verifies its own module (release only, like its C++ tests,
      # since L1 checks every module) and archives its declared services. Only
      # Linux provisions Go: services are cross-built there for every platform.
      - name: Plan this row's recorded Go modules and services
        id: go_plan
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.configure.outcome == 'success' }}
        run: |
          python build/ci/common/go_checks.py plan --build-info "build/target/_build/$env:PRESET/gyo-build.json" --product $env:GYO_PRODUCT --output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Provision the Go version the recorded modules declare
        id: go_setup
        if: ${{ !cancelled() && steps.go_plan.outputs.has_go_modules == 'true' && (inputs.profile == 'release' || matrix.kind == 'toolchain' || steps.go_plan.outputs.has_go_services == 'true') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.go_plan.outputs.go_version_file }}
          cache: true
          cache-dependency-path: ${{ steps.go_plan.outputs.go_dependency_files }}

      - name: Vet, test and race-test this row's Go modules
        id: go
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' && (inputs.profile == 'release' || matrix.kind == 'toolchain') }}
        run: |
          python build/ci/common/go_checks.py check --build-info "build/target/_build/$env:PRESET/gyo-build.json" --product $env:GYO_PRODUCT --race 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/go-checks.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cross-build and archive this product's Go services
        id: go_services
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' && steps.go_plan.outputs.has_go_services == 'true' }}
        run: |
          python build/ci/common/go_checks.py build --build-info "build/target/_build/$env:PRESET/gyo-build.json" --product $env:GYO_PRODUCT --output-dir "build/target/_build/$env:PRESET/go-services" --revision $env:SOURCE_COMMIT 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/go-services.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Service archives are CI artifacts only. Their artifact name stays
      # outside the gyo-package-* pattern that release draft preparation reads.
      - name: Upload this product's Go service archives
        if: ${{ !cancelled() && steps.go_services.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gyo-service-${{ matrix.product }}
          overwrite: true
          path: |
            build/target/_build/${{ matrix.preset }}/go-services/gyo-*.tar.gz
            build/target/_build/${{ matrix.preset }}/go-services/gyo-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Statistics are diagnostics only and never decide the job result.
      # Packaging jobs restore the compiler cache but never save it.
      - name: Record compiler cache statistics
        if: always() && steps.setup.outcome == 'success'
        run: |
          sccache --show-stats 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/sccache-stats.log"
          sccache --stop-server 2>&1 | Out-Null
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.product }}-${{ matrix.platform }}
          overwrite: true
          path: |
            build/target/_build/${{ matrix.preset }}/logs
            build/target/_build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/target/_build/${{ matrix.preset }}/Testing/Temporary
            ${{ env.GYO_HOST_TOOLS }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.GYO_HOST_TOOLS }}/_deps/**/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.GYO_HOST_TOOLS }}/Testing/Temporary
            build/target/_build/${{ matrix.preset }}/shaders/**/manifest.json
            build/target/_build/${{ matrix.preset }}-core/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize acceptance boundary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CORE_RESULT: ${{ steps.core.outcome }}
          APP_COPY_RESULT: ${{ steps.app_copy.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          GPU_RESULT: ${{ steps.gpu_smoke.outcome }}
          ARCHIVE_RESULT: ${{ steps.archive.outcome }}
          GO_RESULT: ${{ steps.go.outcome }}
          GO_SERVICES_RESULT: ${{ steps.go_services.outcome }}
          BUILD_HOST: ${{ matrix.host }}
        run: |
          $entry = $env:GYO_PRODUCT
          @"
          ## $entry / $env:GYO_PACKAGE_PLATFORM / $env:ACCEPTANCE_PROFILE
          | Check | Result |
          | --- | --- |
          | Build host / target | $env:BUILD_HOST / $env:GYO_PACKAGE_PLATFORM |
          | Target CPU execution (tests and installed checks) | $env:GYO_CPU_EXECUTION |
          | Build | $env:BUILD_RESULT |
          | CPU / shader tests | $env:TEST_RESULT |
          | Core baseline | $env:CORE_RESULT |
          | Independent app copy (Windows release baseline) | $env:APP_COPY_RESULT |
          | Installed product acceptance | $env:SMOKE_RESULT |
          | Linux software GPU / engine baseline | $env:GPU_RESULT |
          | Archive and checksum | $env:ARCHIVE_RESULT |
          | Go vet / test / race (Linux) | $env:GO_RESULT |
          | Go service archives (Linux cross-builds) | $env:GO_SERVICES_RESULT |

          Package checks are declared by the central product acceptance contract. Physical GPU acceptance remains manual.
          Only Linux runs GPU checks (software Vulkan); macOS rows have no GPU checks, and a rosetta2 row verifies its x86_64 package translated on an arm64 host. The archive records the same execution mode.
          Quick artifacts cannot substitute for release acceptance.
          "@ >> $env:GITHUB_STEP_SUMMARY

  validation:
    name: CI validation
    needs: [prepare, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every baseline and configured app/platform job to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if [ "$PREPARE_RESULT" != success ] || [ "$NATIVE_RESULT" != success ]; then
            echo '::error::Event checks and every platform build/test/smoke/package must succeed; skipped or cancelled jobs do not pass.'
            exit 1
          fi
          echo 'All baseline jobs and configured app/platform packages passed.' >> "$GITHUB_STEP_SUMMARY"

