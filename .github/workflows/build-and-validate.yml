name: Build and validate

on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact source commit captured by the caller
        required: true
        type: string
      profile:
        description: quick or release acceptance
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate source and CI helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.registry.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify the immutable commit and acceptance profile
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ACCEPTANCE_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo '::error::The checkout must match the full source commit SHA.'
            exit 1
          fi
          case "$ACCEPTANCE_PROFILE" in
            quick|release) ;;
            *) echo '::error::Unknown acceptance profile.'; exit 1 ;;
          esac
      - name: Export the authoritative project selection
        id: registry
        run: python build/ci/common/app_registry.py --output "$GITHUB_OUTPUT"
      - name: Test package, draft preparation and smoke failure policies
        run: python -m unittest discover -s tests/common/ci -v

  native:
    name: ${{ matrix.product }} / ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Three toolchain products always exist, including an entirely empty app registry.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      PRESET: ${{ matrix.preset }}
      GYO_PRODUCT: ${{ matrix.product }}
      # VsDevCmd owns Platform (= x64); Windows env names are case-insensitive.
      GYO_PACKAGE_PLATFORM: ${{ matrix.platform }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ACCEPTANCE_PROFILE: ${{ inputs.profile }}
      GPU_SMOKE_SUITE: ${{ inputs.profile == 'release' && 'full' || 'quick' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          lfs: true

      - name: Initialize MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev \
            mesa-vulkan-drivers vulkan-tools xvfb xauth
          # SDL 3.4 enables XTest by default and requires its development files.
          pkg-config --modversion xtst

      - name: Select the macOS compiler toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::ci-macos requires the macos-15 ARM64 runner; review the matrix label."
            exit 1
          fi
          xcode_developer=/Applications/Xcode_16.4.app/Contents/Developer
          if [ ! -d "$xcode_developer" ]; then
            echo "::error::Pinned Xcode 16.4 is absent. Review actions/runner-images macos-15-arm64, then update the selected Xcode, toolchain cache key and docs together."
            exit 1
          fi
          sudo xcode-select -s "$xcode_developer"
          xcodebuild -version

      - name: Record toolchain
        id: tools
        run: |
          New-Item -ItemType Directory -Force "build/target/_build/$env:PRESET/logs" | Out-Null
          cmake --version
          ninja --version
          python --version
          if ($IsWindows) {
            "compiler=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT
          } else {
            $compiler = (& $env:CXX --version | Select-Object -First 1) -replace '[^a-zA-Z0-9.-]', '_'
            "compiler=$compiler" >> $env:GITHUB_OUTPUT
          }

      - name: Configure the selected product and engine verification
        id: configure
        run: |
          $editor = if ($env:GYO_PRODUCT -eq 'toolchain') { 'ON' } else { 'OFF' }
          $apps = if ($env:GYO_PRODUCT -eq 'toolchain') { '' } else { $env:GYO_PRODUCT }
          cmake --preset $env:PRESET "-DGYO_APPS=$apps" "-DGYO_BUILD_UI_EDITOR=$editor" -DBUILD_TESTING=ON -DGYO_ENABLE_PACKAGING=ON -DGYO_UI_EDITOR_BUILD_GUI=ON 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Get-Content "build/target/_build/$env:PRESET/gyo-build.json" -Raw | ConvertFrom-Json
          "has_shader_tools=$($build.shader_host_tools.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "has_shader_bundles=$($build.shader_bundles.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify required offline Metal compilation
        if: runner.os == 'macOS' && steps.configure.outputs.has_shader_bundles == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun -sdk macosx metal -v
          printf '#include <metal_stdlib>\nusing namespace metal;\nkernel void probe() {}\n' > "$RUNNER_TEMP/gyo-metal-probe.metal"
          xcrun -sdk macosx metal -c "$RUNNER_TEMP/gyo-metal-probe.metal" -o "$RUNNER_TEMP/gyo-metal-probe.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/gyo-metal-probe.air" -o "$RUNNER_TEMP/gyo-metal-probe.metallib"

      - name: Cache pinned native shader tools
        if: steps.configure.outputs.has_shader_tools == 'true'
        uses: actions/cache@v6
        with:
          path: build/target/_build/${{ matrix.preset }}/host-tools
          key: shader-tools-v1-${{ matrix.platform }}-${{ matrix.toolchain }}-${{ steps.tools.outputs.compiler }}-${{ hashFiles('engine/render/shaders/pipeline/**', 'build/cmake/GyoShaders.cmake', 'engine/base/include/engine/base/Sha256.hpp', 'engine/base/src/Sha256.cpp') }}

      - name: Build the selected graph and its tests
        id: build
        run: |
          cmake --build --preset $env:PRESET 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CPU, headless and shader tests
        id: tests
        if: inputs.profile == 'release' || matrix.kind == 'toolchain'
        run: |
          ctest --preset $env:PRESET --output-junit "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/logs/tests.xml" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run host shader reflection and rejection tests
        id: shaders
        if: always() && inputs.profile == 'release' && steps.build.outcome == 'success' && steps.configure.outputs.has_shader_tools == 'true'
        run: |
          ctest --test-dir "build/target/_build/$env:PRESET/host-tools" -C Release -L shader --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/logs/shader-tests.xml" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/shader-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test core with optional modules disabled
        id: core
        if: always() && matrix.kind == 'toolchain' && steps.tools.outcome == 'success'
        run: |
          cmake --preset core -B "build/target/_build/$env:PRESET-core" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/core-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/target/_build/$env:PRESET-core" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/core-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "build/target/_build/$env:PRESET-core" --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/logs/core-tests.xml" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/core-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify independent copied game fixtures
        id: app_copy
        if: runner.os == 'Windows' && matrix.kind == 'toolchain' && inputs.profile == 'release'
        timeout-minutes: 60
        run: |
          python tests/common/ci/app_copy_integration.py --repository "$env:GITHUB_WORKSPACE" --workdir "build/target/_build/$env:PRESET-app-copy" --reuse-cache "build/target/_build/$env:PRESET/CMakeCache.txt" --parallel $env:CMAKE_BUILD_PARALLEL_LEVEL --logs "build/target/_build/$env:PRESET/logs/app-copy" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/app-copy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble the selected product package
        id: package
        run: |
          cmake --install "build/target/_build/$env:PRESET" --component $env:GYO_PRODUCT --prefix "$env:GITHUB_WORKSPACE/build/target/_build/$env:PRESET/stage" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/acceptance/common/run_package_checks.py --inspect --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --platform $env:GYO_PACKAGE_PLATFORM --revision $env:SOURCE_COMMIT --profile $env:ACCEPTANCE_PROFILE --logs "build/target/_build/$env:PRESET/logs" >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installed native dependencies
        id: package_validation
        run: |
          python build/acceptance/common/validate_package.py --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --logs "build/target/_build/$env:PRESET/logs" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/package-linkage-check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run installed product acceptance
        id: smoke
        timeout-minutes: 20
        run: |
          $probeArgs = @()
          $probeDirectory = "build/target/_build/$env:PRESET/acceptance/$env:GYO_PRODUCT/bin"
          if (Test-Path $probeDirectory) { $probeArgs = @("--probe-directory", $probeDirectory) }
          python build/acceptance/common/run_package_checks.py @probeArgs --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --platform $env:GYO_PACKAGE_PLATFORM --revision $env:SOURCE_COMMIT --profile $env:ACCEPTANCE_PROFILE --logs "build/target/_build/$env:PRESET/logs" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/installed-checks.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run common engine or declared product Linux GPU checks
        id: gpu_smoke
        timeout-minutes: 20
        if: runner.os == 'Linux' && (matrix.kind == 'toolchain' || steps.package.outputs.has_gpu == 'true')
        shell: bash
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          SDL_LOGGING: '*=info'
        run: |
          set -euo pipefail
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print)
          if [ "${#icds[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Mesa Lavapipe ICD, found ${#icds[@]}"
            exit 1
          fi
          export VK_DRIVER_FILES="${icds[0]}"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gyo-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1920x1080x24' vulkaninfo --summary > "build/target/_build/$PRESET/logs/vulkan-info.log" 2>&1
          if [ "$GYO_PRODUCT" = toolchain ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' ctest \
              --test-dir "build/target/_build/$PRESET" -L gpu -R '^render\.' \
              --no-tests=error --output-on-failure \
              --output-junit "$GITHUB_WORKSPACE/build/target/_build/$PRESET/logs/common-gpu-tests.xml" \
              2>&1 | tee "build/target/_build/$PRESET/logs/common-gpu-tests.log"
          else
            xvfb-run -a -s '-screen 0 1920x1080x24' python build/acceptance/common/run_package_checks.py \
              --gpu --driver vulkan --probe-directory "build/target/_build/$PRESET/acceptance/$GYO_PRODUCT/bin" --stage "build/target/_build/$PRESET/stage" --product "$GYO_PRODUCT" \
              --platform "$GYO_PACKAGE_PLATFORM" --revision "$SOURCE_COMMIT" --profile "$ACCEPTANCE_PROFILE" \
              --logs "build/target/_build/$PRESET/logs" 2>&1 | tee "build/target/_build/$PRESET/logs/installed-gpu-checks.log"
          fi

      - name: Archive the verified product package
        id: archive
        run: |
          python build/ci/common/archive_package.py --stage "build/target/_build/$env:PRESET/stage" --product $env:GYO_PRODUCT --output "build/target/_build/$env:PRESET/gyo-$env:GYO_PRODUCT-$env:GYO_PACKAGE_PLATFORM.tar.gz" --revision $env:SOURCE_COMMIT --platform $env:GYO_PACKAGE_PLATFORM --smoke-report "build/target/_build/$env:PRESET/logs/acceptance.json" 2>&1 | Tee-Object "build/target/_build/$env:PRESET/logs/archive.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload this product and platform package
        if: success() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gyo-package-${{ matrix.product }}-${{ matrix.platform }}
          overwrite: true
          path: |
            build/target/_build/${{ matrix.preset }}/gyo-${{ matrix.product }}-${{ matrix.platform }}.tar.gz
            build/target/_build/${{ matrix.preset }}/gyo-${{ matrix.product }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.product }}-${{ matrix.platform }}
          overwrite: true
          path: |
            build/target/_build/${{ matrix.preset }}/logs
            build/target/_build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/target/_build/${{ matrix.preset }}/Testing/Temporary
            build/target/_build/${{ matrix.preset }}/host-tools/CMakeFiles/CMakeConfigureLog.yaml
            build/target/_build/${{ matrix.preset }}/host-tools/_deps/**/CMakeFiles/CMakeConfigureLog.yaml
            build/target/_build/${{ matrix.preset }}/host-tools/Testing/Temporary
            build/target/_build/${{ matrix.preset }}/shaders/**/manifest.json
            build/target/_build/${{ matrix.preset }}-core/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize acceptance boundary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CORE_RESULT: ${{ steps.core.outcome }}
          APP_COPY_RESULT: ${{ steps.app_copy.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          GPU_RESULT: ${{ steps.gpu_smoke.outcome }}
          ARCHIVE_RESULT: ${{ steps.archive.outcome }}
        run: |
          $entry = $env:GYO_PRODUCT
          @"
          ## $entry / $env:GYO_PACKAGE_PLATFORM / $env:ACCEPTANCE_PROFILE
          | Check | Result |
          | --- | --- |
          | Build | $env:BUILD_RESULT |
          | CPU / shader tests | $env:TEST_RESULT |
          | Core baseline | $env:CORE_RESULT |
          | Independent app copy (Windows release baseline) | $env:APP_COPY_RESULT |
          | Installed product acceptance | $env:SMOKE_RESULT |
          | Linux software GPU / engine baseline | $env:GPU_RESULT |
          | Archive and checksum | $env:ARCHIVE_RESULT |

          Package checks are declared by the central product acceptance contract. Physical GPU acceptance remains manual.
          Quick artifacts cannot substitute for release acceptance.
          "@ >> $env:GITHUB_STEP_SUMMARY

  validation:
    name: CI validation
    needs: [prepare, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every baseline and configured app/platform job to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if [ "$PREPARE_RESULT" != success ] || [ "$NATIVE_RESULT" != success ]; then
            echo '::error::Event checks and every platform build/test/smoke/package must succeed; skipped or cancelled jobs do not pass.'
            exit 1
          fi
          echo 'All baseline jobs and configured app/platform packages passed.' >> "$GITHUB_STEP_SUMMARY"

