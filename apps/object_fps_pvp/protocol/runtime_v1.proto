syntax = "proto3";

package object_fps_pvp.runtime.v1;
option go_package = "gyo.local/object_fps_pvp/protocol/runtimev1";

// The local IPC host decodes this into product data. Match never sees protobuf,
// sessions, endpoints, or wire envelopes.
message Ready {
  string arena_id = 1;
  uint32 arena_version = 2;
  uint32 tick_rate = 3;
  uint32 snapshot_interval_ticks = 4;
  uint32 max_players = 5;
}
message PlayerJoin { uint64 player_id = 1; }
message PlayerLeave { uint64 player_id = 1; }
message PlayerInput {
  uint64 player_id = 1;
  uint64 input_sequence = 2;
  uint64 client_tick = 3;
  float move_forward = 4;
  float move_right = 5;
  float yaw = 6;
  float pitch = 7;
}
message JoinResult {
  uint64 player_id = 1;
  bool accepted = 2;
  string reason = 3;
}
message PlayerState {
  uint64 player_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float yaw = 5;
  float pitch = 6;
  uint64 last_input_sequence = 7;
}
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
}
message RuntimeError {
  uint64 player_id = 1;
  string code = 2;
  string message = 3;
}
message RuntimeEnvelope {
  uint32 protocol_version = 1;
  oneof message {
    Ready ready = 10;
    PlayerJoin join = 11;
    PlayerLeave leave = 12;
    PlayerInput input = 13;
    JoinResult join_result = 14;
    RuntimeError error = 15;
    WorldSnapshot snapshot = 16;
  }
}
