syntax = "proto3";

package object_fps_pvp.runtime.v5;
option go_package = "gyo.local/object_fps_pvp/protocol/runtimev5";

// The local IPC host decodes this into product data. Match never sees protobuf,
// sessions, endpoints, or wire envelopes.
message Ready {
  string arena_id = 1;
  uint32 arena_version = 2;
  uint32 tick_rate = 3;
  uint32 snapshot_interval_ticks = 4;
  uint32 max_players = 5;
  CombatRules combat_rules = 6;
  float jump_height = 7;
  float gravity = 8;
}
message PlayerJoin { uint64 player_id = 1; }
message PlayerLeave { uint64 player_id = 1; }
// A single immutable 1/60-second movement step. No client time or position.
message MovementCommand {
  uint64 sequence = 1;
  float move_forward = 2;
  float move_right = 3;
  float yaw = 4;
  float pitch = 5;
  bool jump_requested = 6;
}
// Entire unacknowledged window, strictly ordered, at most 12 commands.
message PlayerInput {
  uint64 player_id = 1;
  repeated MovementCommand commands = 2;
  uint64 movement_epoch = 3;
  uint64 life_generation = 4;
  // Latest snapshot tick the Client applied; merged windows carry the largest.
  uint64 observed_authority_tick = 5;
}
message JoinResult {
  uint64 player_id = 1;
  bool accepted = 2;
  string reason = 3;
}
message PlayerState {
  uint64 player_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float yaw = 5;
  float pitch = 6;
  uint64 last_resolved_command = 7;
  uint64 movement_epoch = 8;
  uint32 contiguous_pending_commands = 9;
  float vertical_velocity = 10;
  bool grounded = 11;
  uint64 life_generation = 12;
  LifeState life_state = 13;
  uint64 life_state_tick = 14;
  uint64 respawn_tick = 15;
  reserved 16;
  reserved "epoch_start_wait_us";
  // Host timing observation, never simulation input: the smallest movement
  // slack since the previous published snapshot and its command sequence.
  // Slack is the executing tick minus the command's first receipt, or minus
  // the receipt of a command that arrived after its sequence was substituted
  // (negative). Both or neither; |slack| <= 1,000,000 and
  // 1 <= sequence <= last_resolved_command. Only the Client's phase tracking
  // reads it.
  optional uint64 movement_slack_sequence = 17;
  optional sint32 movement_slack_us = 18;
  // Consecutive failed 10-second connection-quality windows (0-2). At 3 the
  // Match evicts the player; the HUD warns while this is non-zero.
  uint32 connection_quality_failures = 19;
}
enum LifeState {
  LIFE_UNSPECIFIED = 0;
  LIFE_ALIVE = 1;
  LIFE_DEAD = 2;
}
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
  repeated CombatState combat = 3;
}
// Match-initiated removal for sustained poor connection quality. The Gateway
// clears the player like a Leave and tells the Client why.
enum EvictionReason {
  EVICTION_UNSPECIFIED = 0;
  EVICTION_HIGH_LATENCY = 1;
  EVICTION_UNSTABLE_INPUT = 2;
}
message PlayerEvicted {
  uint64 player_id = 1;
  EvictionReason reason = 2;
  uint32 reference_age_ms = 3;
  uint32 substituted_permille = 4;
  uint32 movement_resets = 5;
}
message RuntimeError {
  uint64 player_id = 1;
  string code = 2;
  string message = 3;
}
message RuntimeEnvelope {
  uint32 protocol_version = 1;
  oneof message {
    Ready ready = 10;
    PlayerJoin join = 11;
    PlayerLeave leave = 12;
    PlayerInput input = 13;
    JoinResult join_result = 14;
    RuntimeError error = 15;
    WorldSnapshot snapshot = 16;
    ActionBatch actions = 17;
    ActionResults action_results = 18;
    PlayerEvicted evicted = 19;
  }
}

message ActionBatch {
  uint64 player_id = 1;
  repeated ShotRequest shots = 2;
  uint64 acknowledged_through = 3;
}
message ActionResults {
  uint64 player_id = 1;
  uint64 retired_through = 2;
  repeated ShotDecision decisions = 3;
}

message CombatRules {
  uint32 maximum_hp = 1;
  uint32 shot_damage = 2;
  uint64 cooldown_ticks = 3;
  float shot_range = 4;
  uint32 maximum_reference_age_ms = 5;
  uint32 magazine_capacity = 6;
  uint64 reload_ticks = 7;
  uint64 respawn_ticks = 8;
}
message CombatState {
  uint64 player_id = 1;
  uint32 hp = 2;
  uint64 next_allowed_shot_tick = 3;
  uint64 life_generation = 4;
  uint32 magazine_ammo = 5;
  uint64 reload_action_id = 6;
  uint64 reload_start_tick = 7;
  uint64 reload_end_tick = 8;
  uint64 last_shot_action_id = 9;
  uint64 last_shot_tick = 10;
}
// Historical names are retained; requests and decisions cover Shot and Reload.
enum ActionKind {
  ACTION_UNSPECIFIED = 0;
  ACTION_SHOT = 1;
  ACTION_RELOAD = 2;
}
message ShotRequest {
  uint64 action_id = 1;
  uint64 observed_authority_tick = 2;
  optional float yaw = 3;
  optional float pitch = 4;
  ActionKind kind = 5;
  uint64 life_generation = 6;
}
enum ShotRejection {
  REJECTION_NONE = 0;
  REJECTION_INVALID_REFERENCE = 1;
  REJECTION_EXPIRED = 2;
  REJECTION_COOLDOWN = 3;
  REJECTION_STALE_LIFE = 4;
  REJECTION_INVALID_LIFE = 5;
  REJECTION_DEAD = 6;
  REJECTION_RELOADING = 7;
  REJECTION_EMPTY_MAGAZINE = 8;
  REJECTION_MAGAZINE_FULL = 9;
}
enum ShotHitKind {
  HIT_MISS = 0;
  HIT_WORLD = 1;
  HIT_PLAYER = 2;
}
message ShotDecision {
  uint64 action_id = 1;
  uint64 resolved_tick = 2;
  bool accepted = 3;
  ShotRejection rejection = 4;
  ShotHitKind hit_kind = 5;
  uint64 target_id = 6;
  uint32 damage = 7;
  ActionKind kind = 8;
  uint64 life_generation = 9;
  uint64 target_life_generation = 10;
}
