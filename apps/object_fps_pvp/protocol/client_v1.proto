syntax = "proto3";

package object_fps_pvp.client.v1;
option go_package = "gyo.local/object_fps_pvp/protocol/clientv1";

// This remote-client contract is independent of runtime_v1.proto.
message Hello { string session_token = 1; }
message Welcome {
  uint64 player_id = 1;
  uint64 match_id = 2;
  uint32 tick_rate = 3;
  uint32 snapshot_rate = 4;
  string arena_id = 5;
  uint32 arena_version = 6;
}
message PlayerInput {
  uint64 input_sequence = 1;
  uint64 client_tick = 2;
  float move_forward = 3;
  float move_right = 4;
  float yaw = 5;
  float pitch = 6;
}
message PlayerState {
  uint64 player_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float yaw = 5;
  float pitch = 6;
  uint64 last_input_sequence = 7;
}
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
}
message Error {
  string code = 1;
  string message = 2;
}
