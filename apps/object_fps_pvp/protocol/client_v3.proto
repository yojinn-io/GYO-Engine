syntax = "proto3";

package object_fps_pvp.client.v3;
option go_package = "gyo.local/object_fps_pvp/protocol/clientv3";

// This remote-client contract is independent of runtime_v3.proto.
message Hello { string session_token = 1; }
message Welcome {
  uint64 player_id = 1;
  uint64 match_id = 2;
  uint32 tick_rate = 3;
  uint32 snapshot_rate = 4;
  string arena_id = 5;
  uint32 arena_version = 6;
}
// A single immutable 1/60-second movement step. No client time or position.
message MovementCommand {
  uint64 sequence = 1;
  float move_forward = 2;
  float move_right = 3;
  float yaw = 4;
  float pitch = 5;
}
// Entire unacknowledged window, strictly ordered, at most 12 commands.
message PlayerInput {
  repeated MovementCommand commands = 1;
  uint64 movement_epoch = 2;
}
message PlayerState {
  uint64 player_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float yaw = 5;
  float pitch = 6;
  uint64 last_resolved_command = 7;
  uint64 movement_epoch = 8;
  uint32 contiguous_pending_commands = 9;
}
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
}
message Error {
  string code = 1;
  string message = 2;
}
